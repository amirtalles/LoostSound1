<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb">
<title>LOST SOUND</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f2eb;
  --paper:#faf8f3;
  --black:#000;
  --gray:#77736c;
  --line:#e8e4dc;
  --red:#e53935;
  --shadow:0 12px 28px rgba(0,0,0,0.12);
}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--black);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,sans-serif;overflow-x:hidden}
body{min-height:100vh}
button,input,textarea,select{font-family:inherit}
button{border:0;background:none;cursor:pointer}
img{max-width:100%;display:block}
audio{display:none}

.app{min-height:100vh;padding-bottom:130px}

/* TOPBAR */
.topbar{height:54px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;background:rgba(245,242,235,.94);backdrop-filter:blur(16px)}
.top-left{position:relative;display:flex;align-items:center;gap:6px}
.brand-logo-btn{width:38px;height:38px;border-radius:50%;background:#000;display:grid;place-items:center;cursor:pointer;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.12)}
.brand-fallback{color:#fff;font-size:10px;font-weight:900;letter-spacing:.05em}

/* SOCIAL POPUP */
.social-popup{position:absolute;top:46px;left:0;background:#ffffff;border-radius:14px;padding:6px;box-shadow:0 14px 35px rgba(0,0,0,0.12);border:1px solid var(--line);min-width:145px;display:none;z-index:500}
.social-popup.show{display:flex;flex-direction:column;gap:2px;animation:popIn .16s cubic-bezier(0.16,1,0.3,1) forwards}
@keyframes popIn{from{opacity:0;transform:scale(0.92) translateY(-4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.social-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:12px;font-weight:700;color:#000;text-decoration:none;transition:0.15s}
.social-item:hover{background:var(--bg)}
.social-svg{width:16px;height:16px;fill:currentColor}

.top-title{font-size:11px;letter-spacing:.22em;font-weight:800;text-transform:uppercase}
.top-menu-btn{font-size:20px;padding:4px;line-height:1}

/* MAIN PAGE */
.page{width:100%;max-width:920px;margin:auto;padding:12px 18px}
.view{display:none}
.view.active{display:block}

/* HERO SECTION */
.hero-layout{display:grid;grid-template-columns:1fr 185px;align-items:center;gap:15px;margin:8px 0 28px;position:relative}
.hero-meta-top{font-size:9.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:#000;margin-bottom:6px}
.hero-title{font-size:clamp(34px,5.8vw,48px);line-height:0.86;letter-spacing:-0.05em;font-weight:900}
.hero-year{font-size:10px;font-weight:700;letter-spacing:.12em;margin-top:16px}
.hero-year-right{position:absolute;top:0;right:0;font-size:10px;font-weight:700;letter-spacing:.12em}

/* HERO COVER & VINYL */
.hero-vinyl-stage{position:relative;width:100%;height:145px;display:flex;align-items:center;justify-content:flex-start}
.stage-cover{position:relative;z-index:2;width:130px;height:130px;border-radius:6px;overflow:hidden;background:#111;box-shadow:var(--shadow);flex:0 0 auto}
.stage-cover video{width:100%;height:100%;object-fit:cover;display:block}
.stage-vinyl{position:absolute;z-index:1;left:65px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#1a1a1a 0 5%,#444 5.5% 6%,#0a0a0a 6.5% 12%,#222 12.5% 13%,#050505 13.5% 27%,#222 27.5% 28%,#050505 28.5% 44%,#222 44.5% 45%,#050505 45.5% 61%,#1a1a1a 61.5% 62%,#050505 62.5% 100%);box-shadow:0 8px 24px rgba(0,0,0,0.22);pointer-events:none}
.stage-vinyl.playing{animation:rotateVinyl 4s linear infinite}
@keyframes rotateVinyl{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* SECTION HEAD */
.section-title-line{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.section-title{font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}

/* TRACK ROW */
.track-row{display:grid;grid-template-columns:74px 38px minmax(0,1fr) 24px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.track-thumb-wrap{position:relative;width:74px;height:74px}
.track-thumb{width:100%;height:100%;object-fit:cover;border-radius:6px;background:#111}
.avatar-badge{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);box-shadow:0 2px 6px rgba(0,0,0,0.15);background:#111;z-index:4;cursor:pointer}
.avatar-badge-fallback{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);background:#111;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:bold;z-index:4;cursor:pointer}
.track-play-btn{width:38px;height:38px;border-radius:50%;background:#ffffff;box-shadow:0 3px 10px rgba(0,0,0,0.06);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;cursor:pointer;transition:0.15s}
.track-play-btn:hover{background:#000;color:#fff}
.track-meta{min-width:0;cursor:pointer}
.track-meta h4{font-size:13.5px;font-weight:800;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.track-meta .artist-name{font-size:11px;color:var(--gray);margin-top:3px;font-weight:500}
.track-meta .track-stats{font-size:9.5px;color:var(--gray);margin-top:4px;display:flex;gap:6px}
.track-more-btn{font-size:18px;color:#000;cursor:pointer;text-align:right}

/* DOCK MINI PLAYER */
.dock-player{display:none;position:fixed;left:14px;right:14px;bottom:64px;z-index:400;padding:8px 12px;background:#ffffff;border-radius:14px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,0.08)}
.dock-player.open{display:block}
.dock-inner{display:grid;grid-template-columns:44px minmax(0,1fr) 38px;gap:10px;align-items:center}
.dock-art{width:44px;height:44px;border-radius:5px;object-fit:cover;background:#111}
.dock-meta h5{font-size:12px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock-meta p{font-size:10px;color:var(--gray);margin-top:1px}
.dock-progress{width:100%;height:2px;background:#e5e0d8;margin-top:6px;position:relative;border-radius:2px;cursor:pointer}
.dock-progress-bar{height:100%;width:0;background:var(--red);border-radius:2px}
.dock-times{display:flex;justify-content:space-between;font-size:8.5px;color:var(--gray);font-weight:700;margin-top:3px}
.dock-play-circle{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:13px;margin-left:auto;cursor:pointer}

/* BOTTOM NAVIGATION */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:350;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:rgba(245,242,235,0.96);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav-item{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--gray);font-size:9.5px;font-weight:700;text-decoration:none}
.nav-item.active{color:#000}
.nav-icon{font-size:16px;line-height:1}

/* FORMS & DRAWERS & MODALS */
.upload-card{background:#ffffff;padding:20px;border-radius:14px;border:1px solid var(--line);max-width:540px;margin:auto}
.field{margin:12px 0}
.field label{display:block;font-size:9px;font-weight:800;letter-spacing:.12em;margin-bottom:6px;color:var(--gray)}
.field input,.field textarea,.field select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px;outline:none}
.primary-btn{padding:11px 20px;background:#000;color:#fff;border-radius:24px;font-size:10px;font-weight:800;letter-spacing:.12em;width:100%;margin-top:8px}
.drawer{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,.4)}.drawer.open{display:block}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(320px,85vw);padding:22px;background:var(--paper);overflow-y:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.drawer-list{margin-top:25px}.drawer-list button{width:100%;padding:12px 0;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
.toast{position:fixed;left:50%;bottom:130px;z-index:2000;transform:translateX(-50%);padding:10px 18px;background:#000;color:#fff;border-radius:30px;font-size:11px;font-weight:700;white-space:nowrap}
.auth-overlay{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.auth-overlay.open{display:flex}
.auth-panel{width:100%;max-width:380px;background:var(--paper);border-radius:14px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.auth-title{font-size:28px;line-height:.9;letter-spacing:-.05em;margin-bottom:8px;font-weight:900}
.auth-submit{width:100%;padding:12px;margin-top:10px;border-radius:25px;background:#000;color:#fff;font-weight:bold;font-size:11px}
.profile-actions{display:flex;gap:8px;margin-top:12px}
.small-btn{padding:8px 12px;border:1px solid var(--line);border-radius:18px;font-size:9.5px;background:var(--paper);font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}
.card{cursor:pointer;background:var(--paper);padding:10px;border-radius:8px;border:1px solid var(--line)}
.card img{aspect-ratio:1;object-fit:cover;border-radius:6px}
.card h4{margin-top:8px;font-size:12px;font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card p{font-size:10px;color:var(--gray);margin-top:2px}

@media(max-width:480px){
  .hero-layout{grid-template-columns:1fr 160px;gap:8px}
  .stage-cover{width:115px;height:115px}
  .stage-vinyl{left:55px;width:115px;height:115px}
  .track-row{grid-template-columns:64px 34px minmax(0,1fr) 20px;gap:10px}
  .track-thumb-wrap{width:64px;height:64px}
  .track-play-btn{width:34px;height:34px}
}
</style>
</head>
<body>

<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="top-left">
      <div id="brandLogoBtn" class="brand-logo-btn" role="button" aria-label="Socials">
        <div class="brand-fallback">LSO</div>
      </div>
      <div id="socialPopup" class="social-popup">

          <span>Instagram</span>

    </div>
    <div class="top-title">LOST SOUND</div>
    <button id="menuButton" class="top-menu-btn">☰</button>
  </header>

  <!-- CONTENT -->
  <main class="page">
    
    <!-- HOME -->
    <section id="home" class="view active">
      <div class="hero-layout">
        <span class="hero-year-right">2024</span>
        <div>
          <div class="hero-meta-top">MUSIC STREAMING</div>
          <h1 class="hero-title">LOST<br>SOUND</h1>

      <div id="discoverList" class="cards"></div>

    <section id="search" class="view">

  <!-- DOCK MINI PLAYER -->

<script>
const SUPABASE_URL = "https://iezjmlesxdqtgrzopnyf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_oZzBug6zzrXVDEaLljsHeQ_EPQOhcnu";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let tracks = [], artists = [], currentIndex = -1, currentUser = null, currentProfile = null;
let listeningSeconds = 0, lastAudioTime = 0, currentTrackObj = null;
const audio = document.getElementById("audio");

document.addEventListener("DOMContentLoaded", async () => {
  setupIntroVideo();
  bindButtons();
  
  // بازیابی کامل نشست کاربری، آرتیست‌ها و ترک‌های ثبت‌شده در Supabase
  await checkSession();
  await loadArtists();
  await loadTracks();
  restoreLastState();
});

function setupIntroVideo(){
  const v = document.getElementById("introCoverVideo");
  if (!v) return;
  v.addEventListener("ended", () => { v.currentTime = 0; v.play().catch(()=>{}); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && v.paused) v.play().catch(()=>{}); });
}

function bindButtons(){
  const logoBtn = document.getElementById("brandLogoBtn"), popup = document.getElementById("socialPopup");
  if (logoBtn && popup) {
    logoBtn.onclick = (e) => { e.stopPropagation(); popup.classList.toggle("show"); };
    document.addEventListener("click", () => popup.classList.remove("show"));
  }

  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.onclick = () => switchView(btn.dataset.view);
  });
  document.querySelectorAll("[data-go]").forEach(btn => {
    btn.onclick = () => { closeDrawer(); switchView(btn.dataset.go); };
  });

  document.getElementById("openUploadBtn")?.addEventListener("click", () => switchView("upload"));
  document.getElementById("menuButton").onclick = () => document.getElementById("drawer").classList.add("open");
  document.getElementById("closeDrawer").onclick = closeDrawer;
  document.getElementById("authMenuButton").onclick = () => { closeDrawer(); currentUser ? logout() : openAuth(); };
  document.getElementById("authClose").onclick = () => document.getElementById("authOverlay").classList.remove("open");
  document.getElementById("authSubmit").onclick = submitAuth;

  document.getElementById("dockPlayBtn").onclick = togglePlay;
  document.getElementById("dockProgressWrap").onclick = seekAudio;
  document.getElementById("publishButton").onclick = publishTrack;

  document.getElementById("searchInput").oninput = runSearch;

  audio.ontimeupdate = updateProgress;
  audio.onplay = () => {
    document.getElementById("dockPlayBtn").textContent = "Ⅱ";
    document.getElementById("heroVinyl").classList.add("playing");
  };
  audio.onpause = () => {
    document.getElementById("dockPlayBtn").textContent = "▶";
    document.getElementById("heroVinyl").classList.remove("playing");
    saveAudioState();
  };
  audio.onended = nextTrack;
}

function closeDrawer() { document.getElementById("drawer").classList.remove("open"); }
function openAuth() { document.getElementById("authOverlay").classList.add("open"); }

function switchView(viewId){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  const target = document.getElementById(viewId);
  if (target) target.classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === viewId));
  window.scrollTo(0, 0);
  try { localStorage.setItem("ls_last_view", viewId); } catch(e){}
}

async function checkSession(){
  const { data } = await supabaseClient.auth.getSession();
  currentUser = data?.session?.user || null;
  if (currentUser) {
    const { data: p } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
    currentProfile = p || { display_name: currentUser.email.split("@")[0], username: "artist" };
  }
  renderProfile();
  document.getElementById("authMenuButton").textContent = currentUser ? "Logout" : "Login";
}

async function submitAuth(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  if (!email || !password) return toast("Enter email & password.");
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    const { data: signData, error: signError } = await supabaseClient.auth.signUp({ email, password });
    if (signError) return toast(signError.message);
    currentUser = signData.user;
  } else {
    currentUser = data.user;
  }
  document.getElementById("authOverlay").classList.remove("open");
  await checkSession();
  toast("Authenticated.");
}

async function logout(){
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentProfile = null;
  renderProfile();
  toast("Logged out.");
}

async function loadArtists(){
  try {
    const { data } = await supabaseClient.from("artists").select("id,user_id,name,username");
    artists = data || [];
  } catch(e){ artists = []; }
}

async function loadTracks(){
  try {
    const { data, error } = await supabaseClient.from("tracks").select("id,artist_id,title,description,cover_url,audio_url,duration_seconds,play_count,created_at,artists(id,user_id,name,username)").eq("is_published", true).order("created_at", { ascending: false });
    if (error || !data) return;
    
    tracks = data.map(t => {
      const a = Array.isArray(t.artists) ? t.artists[0] : t.artists;
      return {
        id: t.id,
        artistId: t.artist_id,
        artistUserId: a?.user_id || "",
        title: t.title,
        cover: t.cover_url,
        audio: t.audio_url,
        artist: a?.name || "Unknown Artist",
        plays: t.play_count || 0,
        date: formatDate(t.created_at)
      };
    });
    
    renderTracks();
    renderDiscover();
    renderProfile();
  } catch (e) {
    console.warn("loadTracks error:", e);
  }
}

function renderTracks(){
  const container = document.getElementById("latestList");
  if (!container) return;
  container.innerHTML = tracks.map((t, i) => `
    <div class="track-row">
      <div class="track-thumb-wrap">
        <div class="avatar-badge-fallback">${escapeHTML((t.artist||"A")[0].toUpperCase())}</div>
        <img class="track-thumb" src="${safeURL(t.cover)}" alt="">
      </div>
      <button class="track-play-btn" onclick="playIndex(${i})">▶</button>
      <div class="track-meta" onclick="playIndex(${i})">
        <h4>${escapeHTML(t.title)}</h4>
        <div class="artist-name">${escapeHTML(t.artist)}</div>
        <div class="track-stats"><span>${t.date}</span><span>•</span><span>${Number(t.plays||0).toLocaleString()} plays</span></div>
      </div>
      <div class="track-more-btn">⋮</div>
    </div>
  `).join("");
}

function renderDiscover(){
  const disc = document.getElementById("discoverList");
  if (!disc) return;
  disc.innerHTML = tracks.map((t, i) => `
    <div class="card" onclick="playIndex(${i})">
      <img src="${safeURL(t.cover)}" alt="">
      <h4>${escapeHTML(t.title)}</h4>
      <p>${escapeHTML(t.artist)}</p>
    </div>
  `).join("");
}

function renderProfile(){
  const pName = document.getElementById("profileName"), pUser = document.getElementById("profileUsername"), pActs = document.getElementById("profileActions"), pTracks = document.getElementById("profileTracks");
  if (!currentUser) {
    pName.textContent = "LOST SOUND";
    pUser.textContent = "@guest";
    pActs.innerHTML = `<button class="small-btn" onclick="openAuth()">Login / Register</button>`;
    pTracks.innerHTML = "<p style='font-size:11px;color:var(--gray);margin-top:10px'>Login to view your tracks.</p>";
    return;
  }
  pName.textContent = currentProfile?.display_name || "Artist";
  pUser.textContent = "@" + (currentProfile?.username || "user");
  pActs.innerHTML = `<button class="small-btn" onclick="logout()">Logout</button>`;
  
  const mine = tracks.filter(t => t.artistUserId === currentUser.id);
  pTracks.innerHTML = mine.length ? mine.map((t, i) => `
    <div class="track-row">
      <div class="track-thumb-wrap"><img class="track-thumb" src="${safeURL(t.cover)}"></div>
      <button class="track-play-btn" onclick="playIndex(${tracks.indexOf(t)})">▶</button>
      <div class="track-meta" onclick="playIndex(${tracks.indexOf(t)})">
        <h4>${escapeHTML(t.title)}</h4>
        <div class="track-stats">${t.date} • ${t.plays} plays</div>
      </div>
    </div>
  `).join("") : "<p style='font-size:11px;color:var(--gray);margin-top:10px'>No uploads yet.</p>";
}

function playIndex(i, autoplay = true){
  if (i < 0 || i >= tracks.length) return;
  currentIndex = i;
  currentTrackObj = tracks[i];
  listeningSeconds = 0;
  lastAudioTime = 0;

  if (currentTrackObj.audio) {
    audio.src = currentTrackObj.audio;
    audio.load();
    if (autoplay) audio.play().catch(()=>{});
  }

  document.getElementById("dockTitle").textContent = currentTrackObj.title;
  document.getElementById("dockArtist").textContent = currentTrackObj.artist;
  document.getElementById("dockImg").src = currentTrackObj.cover;
  document.getElementById("dockPlayer").classList.add("open");

  try { localStorage.setItem("ls_last_track_id", currentTrackObj.id); } catch(e){}
}

function togglePlay(){
  if (currentIndex < 0) { if (tracks.length) playIndex(0); return; }
  if (audio.paused) audio.play().catch(()=>{}); else audio.pause();
}

function nextTrack(){ if (tracks.length) playIndex((currentIndex + 1) % tracks.length); }

function updateProgress(){
  if (!audio.duration) return;

  if (!audio.paused && audio.currentTime > 0) {
    const timeDelta = audio.currentTime - lastAudioTime;
    if (timeDelta > 0 && timeDelta < 1.5) {
      listeningSeconds += timeDelta;
      if (listeningSeconds >= 60) {
        listeningSeconds = 0;
        if (currentTrackObj) countPlay(currentTrackObj);
      }
    }
  }
  lastAudioTime = audio.currentTime;

  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById("dockProgressBar").style.width = pct + "%";
  document.getElementById("dockCurrentTime").textContent = formatSeconds(audio.currentTime);
  document.getElementById("dockDuration").textContent = formatSeconds(audio.duration);
}

async function countPlay(track){
  if (!track?.id) return;
  track.plays = Number(track.plays || 0) + 1;
  renderTracks();

  try {
    await supabaseClient.rpc("increment_play_count", { track_id: track.id });
  } catch(e){}
}

async function publishTrack(){
  if (!currentUser) return openAuth();
  const aFile = document.getElementById("audioFile").files[0];
  const cFile = document.getElementById("coverFile").files[0];
  const title = document.getElementById("uploadTitle").value.trim();
  const artistName = document.getElementById("uploadArtist").value.trim();
  
  if (!aFile || !cFile || !title) return toast("Fill all fields.");
  const btn = document.getElementById("publishButton");
  btn.disabled = true; btn.textContent = "Uploading...";

  try {
    let { data: art } = await supabaseClient.from("artists").select("*").eq("user_id", currentUser.id).maybeSingle();
    if (!art) {
      const { data: newArt } = await supabaseClient.from("artists").insert({ user_id: currentUser.id, name: artistName || "Artist", username: "user" }).select().single();
      art = newArt;
    }

    const aPath = currentUser.id + "/" + Date.now() + "-audio";
    const cPath = currentUser.id + "/" + Date.now() + "-cover";
    await supabaseClient.storage.from("audio").upload(aPath, aFile);
    await supabaseClient.storage.from("covers").upload(cPath, cFile);

    const aUrl = supabaseClient.storage.from("audio").getPublicUrl(aPath).data.publicUrl;
    const cUrl = supabaseClient.storage.from("covers").getPublicUrl(cPath).data.publicUrl;

    await supabaseClient.from("tracks").insert({
      artist_id: art.id, title, cover_url: cUrl, audio_url: aUrl, play_count: 0, is_published: true
    });

    toast("Track published!");
    await loadTracks();
    switchView("home");
  } catch(e) {
    toast("Upload failed.");
  } finally {
    btn.disabled = false; btn.textContent = "PUBLISH TRACK";
  }
}

function runSearch(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const box = document.getElementById("searchResults");
  if (!q) { box.innerHTML = ""; return; }
  const match = tracks.filter(t => (t.title + " " + t.artist).toLowerCase().includes(q));
  box.innerHTML = match.map((t, i) => `
    <div class="track-row" onclick="playIndex(${tracks.indexOf(t)})">
      <div class="track-thumb-wrap"><img class="track-thumb" src="${safeURL(t.cover)}"></div>
      <button class="track-play-btn">▶</button>
      <div class="track-meta">
        <h4>${escapeHTML(t.title)}</h4>
        <div class="artist-name">${escapeHTML(t.artist)}</div>
      </div>
    </div>
  `).join("") || "<p style='font-size:11px;color:var(--gray);margin-top:10px'>No results.</p>";
}

function seekAudio(e){
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  lastAudioTime = audio.currentTime;
}

function saveAudioState(){
  if (currentTrackObj && audio.currentTime > 0) {
    try { localStorage.setItem("ls_last_seek_time", audio.currentTime); } catch(e){}
  }
}

function restoreLastState(){
  try {
    const lastView = localStorage.getItem("ls_last_view") || "home";
    switchView(lastView);
    const lastTrackId = localStorage.getItem("ls_last_track_id");
    if (lastTrackId && tracks.length) {
      const idx = tracks.findIndex(t => String(t.id) === String(lastTrackId));
      if (idx >= 0) playIndex(idx, false);
    }
  } catch(e){}
}

function formatSeconds(s){ if (!isFinite(s)) return "0:00"; return Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2, "0"); }
function formatDate(d){ if (!d) return "Recently"; return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" }).format(new Date(d)); }
function toast(m){ document.querySelector(".toast")?.remove(); const e = document.createElement("div"); e.className = "toast"; e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), 2200); }
function escapeHTML(v){ return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function safeURL(v){ return String(v??"").replace(/"/g,"%22"); }
</script>
</body>
