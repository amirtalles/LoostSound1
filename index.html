<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  <title>LOST SOUND</title>

  <!-- ادغام مستقیم مانیفست فول‌اسکرین در یک خط -->
  <link rel="manifest" href='data:application/manifest+json,{"id":"com.lostsound.music","name":"LOST SOUND","short_name":"LOST SOUND","start_url":"./index.html","scope":"./","display":"fullscreen","display_override":["fullscreen","standalone"],"background_color":"#0d0d0d","theme_color":"#0d0d0d","orientation":"portrait","icons":[{"src":"assets/icon.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"assets/icon.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <!-- کتابخانه Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141414;
      border-bottom: 1px solid #222;
    }
    .logo {
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
    }
    .container {
      padding: 20px;
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: #181818;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #282828;
    }
    .card h3 {
      margin-bottom: 15px;
      font-size: 1.1rem;
      color: #1db954;
    }
    .field {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.85rem;
      color: #aaa;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #242424;
      border: 1px dashed #444;
      border-radius: 8px;
      color: #aaa;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #1db954;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">LOST SOUND</div>
    <div id="authStatus" style="font-size: 0.85rem; color: #888;">مهمان</div>
  </header>

  <div class="container">
    
    <!-- بخش ورود و ثبت‌نام -->
    <div class="card" id="authSection">
      <h3>حساب کاربری</h3>
      <div class="field">
        <label>ایمیل</label>
        <input type="email" id="emailInput" placeholder="example@mail.com">
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input type="password" id="passwordInput" placeholder="حداقل ۶ کاراکتر">
      </div>
      <button class="btn" id="btnRegister">ثبت‌نام مستقیم</button>
      <button class="btn" style="background:#333; color:#fff;" id="btnLogin">ورود به حساب</button>
      <div class="status-msg" id="authMessage"></div>
    </div>

    <!-- بخش آپلود رسانه با رفع مشکل گالری -->
    <div class="card" id="uploadSection">
      <h3>آپلود موزیک و کاور</h3>
      
      <div class="field">
        <label>انتخاب کاور موزیک (تصویر):</label>
        <input type="file" id="coverFile" accept="image/png, image/jpeg, image/jpg, image/webp">
      </div>

      <div class="field">
        <label>انتخاب فایل صوتی:</label>
        <input type="file" id="audioFile" accept="audio/mp3, audio/wav, audio/mpeg, audio/*">
      </div>

      <button class="btn" id="btnUpload">آپلود در پلتفرم</button>
      <div class="status-msg" id="uploadMessage"></div>
    </div>

  </div>

  <script>
    // ۱. فعال‌سازی Service Worker به صورت داخلی (Inline Blob)
    if ("serviceWorker" in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => clients.claim());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // ۲. تنظیم اتصال Supabase
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"; // آدرس سوپابیس شما
    const SUPABASE_KEY = "YOUR_ANON_KEY"; // کلید عمومی سوپابیس شما
    const supabase = (SUPABASE_URL.indexOf("YOUR_PROJECT") === -1) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) 
      : null;

    // ۳. تضمین باز شدن بی‌درنگ گالری گوشی هنگام لمس
    document.addEventListener("DOMContentLoaded", () => {
      const fileInputs = document.querySelectorAll("input[type='file']");
      fileInputs.forEach((input) => {
        input.removeAttribute("capture");
        input.addEventListener("click", (e) => {
          e.stopPropagation();
        });
      });
    });

    // ۴. مدیریت ثبت‌نام و ورود
    const btnRegister = document.getElementById("btnRegister");
    const btnLogin = document.getElementById("btnLogin");
    const authMessage = document.getElementById("authMessage");
    const authStatus = document.getElementById("authStatus");

    btnRegister.addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();

      if (!email || !password) {
        authMessage.innerText = "لطفاً ایمیل و پسورد را وارد کنید.";
        authMessage.style.color = "#ff4444";
        return;
      }

      if (!supabase) {
        authMessage.innerText = "اکانت با موفقیت در حالت لوکال ساخته شد!";
        authMessage.style.color = "#1db954";
        authStatus.innerText = email;
        return;
      }

      authMessage.innerText = "در حال ساخت اکانت...";
      authMessage.style.color = "#aaa";

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        authMessage.innerText = error.message;
        authMessage.style.color = "#ff4444";
      } else {
        authMessage.innerText = "ثبت‌نام با موفقیت انجام شد!";
        authMessage.style.color = "#1db954";
        authStatus.innerText = email;
      }
    });

    btnLogin.addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();

      if (!supabase) {
        authMessage.innerText = "ورود با موفقیت انجام شد!";
        authMessage.style.color = "#1db954";
        authStatus.innerText = email;
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        authMessage.innerText = error.message;
        authMessage.style.color = "#ff4444";
      } else {
        authMessage.innerText = "ورود موفقیت‌آمیز بود!";
        authMessage.style.color = "#1db954";
        authStatus.innerText = email;
      }
    });

    // ۵. تست آپلود فایل‌ها
    const btnUpload = document.getElementById("btnUpload");
    const uploadMessage = document.getElementById("uploadMessage");

    btnUpload.addEventListener("click", () => {
      const cover = document.getElementById("coverFile").files[0];
      const audio = document.getElementById("audioFile").files[0];

      if (!cover && !audio) {
        uploadMessage.innerText = "حداقل یک فایل کاور یا صوتی انتخاب کنید.";
        uploadMessage.style.color = "#ff4444";
        return;
      }

      uploadMessage.innerText = "فایل‌ها با موفقیت در حافظه انتخاب و آماده شدند.";
      uploadMessage.style.color = "#1db954";
    });
  </script>
</body>
</html>
